<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fireplace preview</title>
    <style>
      :root {
        --stage-width: 1684px;
        --stage-height: 1018px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 100%;
        min-height: 100%;
        overflow: hidden;
        background: #202020;
      }

      body {
        display: grid;
        place-items: center;
      }

      .preview__controls {
        position: fixed;
        z-index: 3;
        top: 16px;
        left: 16px;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        color: #fff;
        font: 14px/1.2 sans-serif;
        background: rgb(0 0 0 / 70%);
        border-radius: 4px;
      }

      .preview {
        position: absolute;
        top: 50%;
        left: 50%;
        width: var(--stage-width);
        height: var(--stage-height);
        transform-origin: center center;
        background: #202020;
      }

      .preview__debug {
        display: none;
        position: absolute;
        z-index: 2;
        top: 0;
        left: 0;
        width: var(--stage-width);
        height: var(--stage-height);
        opacity: 0.5;
        pointer-events: none;
      }

      .preview.debug-visible .preview__debug {
        display: block;
      }

      .preview__frame {
        position: absolute;
        overflow: hidden;
        display: block;
        margin: 0;
        border: 4px solid #808080;
        background: #202020;
      }

      .preview__frame--left {
        top: 45px;
        left: 23px;
        width: 328px;
        height: 975px;
        transform: scale(0.9836);
        transform-origin: top left;
      }

      .preview__frame--top {
        top: 45px;
        left: 339px;
        width: 1038px;
        height: 260px;
        transform: scale(0.9767);
        transform-origin: top left;
      }

      .preview__frame--right {
        top: 45px;
        left: 1347px;
        width: 325px;
        height: 975px;
        transform: scale(0.9836);
        transform-origin: top left;
      }

      .preview__website {
        position: absolute;
        top: 299px;
        left: 345px;
        width: 1002px;
        height: 702px;
        background: #202020;
      }

      @media (max-aspect-ratio: 1684 / 1018) {
        .preview {
          transform: translate(-50%, -50%) scale(calc(100vw / var(--stage-width)));
        }
      }

      @media (min-aspect-ratio: 1684 / 1018) {
        .preview {
          transform: translate(-50%, -50%) scale(calc(100vh / var(--stage-height)));
        }
      }
    </style>
  </head>
  <body>
    <label class="preview__controls">
      <input class="preview__debug-toggle" type="checkbox">
      Show design overlay
    </label>
    <main class="preview" aria-label="Fireplace ad preview">
      <img class="preview__debug" src="design/layout.png" alt="">
      <iframe class="preview__frame preview__frame--left" src="left.html?preview=1" title="Fireplace left"></iframe>
      <iframe class="preview__frame preview__frame--top" src="top.html?preview=1" title="Fireplace top"></iframe>
      <div class="preview__website" aria-label="Publisher website placeholder"></div>
      <iframe class="preview__frame preview__frame--right" src="right.html?preview=1" title="Fireplace right"></iframe>
    </main>
    <script>
      const preview = document.querySelector('.preview');
      const debugToggle = document.querySelector('.preview__debug-toggle');
      const frames = [...document.querySelectorAll('.preview__frame')];

      debugToggle.addEventListener('change', () => {
        preview.classList.toggle('debug-visible', debugToggle.checked);
      });

      frames.forEach((frame) => {
        frame.addEventListener('load', () => {
          frame.contentWindow.postMessage({ type: 'start-fireplace' }, '*');
        });
      });
    </script>
  </body>
</html>
