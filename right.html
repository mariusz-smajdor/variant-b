<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=320, height=975, initial-scale=1">
    <title>Fireplace right</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="creative creative--side" aria-label="Fireplace right skyscraper">
      <img class="creative__layer creative__layer--background" data-role="background" src="assets/right/bg.jpg" width="640" height="1950" alt="">

      <img class="creative__cta creative__cta--right" data-role="cta" src="assets/cta.png" width="345" height="93" alt="Jetzt entdecken">
      <a class="creative__clickout" data-role="clickout" href="https://example.com/landing" target="_blank" rel="noopener" aria-label="Mehr erfahren"></a>
    </main>
    <script src="ad.js"></script>
  </body>
