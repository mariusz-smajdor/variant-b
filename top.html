<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=1032, height=250, initial-scale=1" />
		<title>Fireplace top</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<main class="creative creative--top" aria-label="Fireplace top banner">
			<img
				class="creative__layer creative__layer--background"
				data-role="background"
				src="assets/top/bg.jpg"
				width="2064"
				height="500"
				alt=""
			/>
			<div
				class="creative__headline-line creative__headline-line--one"
				data-role="headline-line"
			>
				<img src="assets/top/hl.png" width="2064" height="500" alt="" />
			</div>
			<div
				class="creative__headline-line creative__headline-line--two"
				data-role="headline-line"
			>
				<img src="assets/top/hl.png" width="2064" height="500" alt="" />
			</div>
			<div
				class="creative__headline-line creative__headline-line--three"
				data-role="headline-line"
			>
				<img
					src="assets/top/hl.png"
					width="2064"
					height="500"
					alt="Natürlich stark bei Hustenreiz und Halsschmerzen."
				/>
			</div>
			<a
				class="creative__clickout"
				data-role="clickout"
				href="https://example.com/landing"
				target="_blank"
				rel="noopener"
				aria-label="Mehr erfahren"
			></a>
		</main>
		<script src="ad.js"></script>
	</body>
</html>
